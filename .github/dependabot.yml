version: 2

# ZEUS: Dependabot is INTENTIONALLY PAUSED (open-pull-requests-limit: 0 on both
# ecosystems) while ZEUS completes its CI/release cleanup (ADR-0006: inherited
# Limboo release publishing is being neutralized) and its bounded infrastructure
# work with a real verification strategy (ADR-0007: Vitest foundation + bounded
# TypeScript 5 migration). No dependency upgrades happen in this window; the
# current package-lock.json is the frozen baseline the infrastructure work will
# be validated against. The pre-existing configuration below is preserved so
# re-enabling is a one-line change — or, preferably, replacement by the future
# ZEUS-native monthly/security-driven policy, planned as part of the CI-cleanup
# infrastructure work (not before).

updates:
  # npm dependencies. Pinned to versions compatible with Vite 5 / Electron 42 —
  # review peer warnings on any bump (especially anything touching Vite).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0 # PAUSED for ZEUS (was 10) — see header comment
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      # Electron and Vite are intentionally pinned; bump them deliberately, not via
      # automated PRs, because of the toolchain coupling documented in CLAUDE.md.
      - dependency-name: "electron"
      - dependency-name: "vite"

  # GitHub Actions used by the workflows in this repository.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0 # PAUSED for ZEUS (was 5) — see header comment
