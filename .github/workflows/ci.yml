name: CI

# Continuous Integration — validates every push and pull request and never
# produces shippable artifacts. Layered, fail-fast stages mirror ci/pipeline.yml:
#   validate  ->  build  ->  test (cross-platform).
# TypeScript is ~5.1 (bounded upgrade, #10) and the renderer is esbuild-bundled,
# so `npm run typecheck` (`tsc --noEmit`) is a required gate (CLAUDE.md §2/§9).
# All reusable logic lives in
# ci/scripts/*.mjs so GitLab CI (the primary pipeline) and GitHub Actions run
# identical behavior.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Install dependencies
        run: npm ci
      - name: Lint sources
        run: npm run lint
      - name: Typecheck
        # Added in #12: `tsc --noEmit` over the whole tree (gate since #10).
        run: npm run typecheck
      - name: Unit tests
        # Added in #12: Vitest pure-module suites (foundation #11) — hermetic,
        # no Electron launch, so the ubuntu validate runner suffices.
        # Cross-platform runtime coverage remains the test job's smoke matrix below.
        run: npm test
      - name: License compliance
        run: node ci/scripts/check-licenses.mjs
      - name: Electron security invariants
        run: node ci/scripts/check-electron-security.mjs
      - name: Provider neutrality (renderer boundary, ADR-0003)
        # Added in #15: renderer code must consume the normalized agent state
        # via the preload bridge + @shared contract — never provider
        # implementations or provider-id conditionals (contract:
        # docs/architecture/provider-boundary.md; reviewed allowlist lives in
        # the script).
        run: node scripts/check-provider-neutrality.mjs
      - name: Manifest + docs integrity
        run: node ci/scripts/check-manifest.mjs
      - name: Bundled release notes in sync with CHANGELOG.md
        # The generated modules are committed so they are reviewable in a diff,
        # which means they can also drift. Nothing enforced the regeneration
        # step until this gate.
        run: npm run gen:notes -- --check
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported advisories"

  build:
    name: Build
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Install dependencies
        run: npm ci
      - name: Build renderer
        run: npx vite build --config vite.renderer.config.mts
      - name: Package (compiles main + preload)
        run: npm run package

  test:
    name: Test (${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        # Electron needs the full GTK/ATK/CUPS/ALSA stack to launch (the smoke test
        # boots a real Electron process), not just nss/gbm — otherwise it fails with
        # "libatk-1.0.so.0: cannot open shared object file". The GTK/ATK/CUPS/ALSA
        # package names changed under Ubuntu 24.04's t64 transition, so try the
        # standard names first and fall back to the t64 variants.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb \
            libnss3 libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
          sudo apt-get install -y libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libasound2 \
            || sudo apt-get install -y libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libgtk-3-0t64 libasound2t64
      - name: Install dependencies
        run: npm ci
      - name: Electron smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node ci/scripts/smoke-test.mjs
      - name: Electron smoke test (macOS / Windows)
        if: runner.os != 'Linux'
        run: node ci/scripts/smoke-test.mjs
