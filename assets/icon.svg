<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 200 200">
  <!-- ZEUS interim mark (ADR-0009): neutral geometric bolt glyph. Hand-authored,
       deterministic, dark-only (#ededed on the foreground ramp), legible at
       16px tray size, no inherited pink. Single source of truth: runtime icons
